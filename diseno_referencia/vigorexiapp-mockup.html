<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vigorexiapp · Rediseño del reloj</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--sf:#121a2a;--ln:#243252;--tx:#e8eef8;--mu:#8798b5;--ac:#6b8cff;--ok:#34d399;--wa:#ffb547;--bn:"Barlow Condensed","Arial Narrow",sans-serif;--bd:"Barlow",system-ui,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2fa;--sf:#fff;--ln:#d3dcee;--tx:#111a2e;--mu:#5b6b89}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:var(--bd);padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font:700 26px var(--bn);text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button{border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:20px;padding:8px 14px;font:600 13px var(--bd);cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#box{position:relative}
#watch{width:466px;height:466px;transform-origin:0 0;position:absolute;left:0;top:0;border-radius:50%;background:#000;overflow:hidden;color:#f1f5f9;box-shadow:0 0 0 10px #1b2233,0 0 0 12px #2a3552,0 20px 50px rgba(0,0,0,.45)}
.ring{position:absolute;inset:0}
.a{position:absolute;left:0;right:0;text-align:center}
.chip{position:absolute;top:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font:600 19px var(--bd);color:#9fb0cc;background:#10172a;border-radius:20px;padding:6px 16px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.chip.p i{background:var(--wa)}.chip.o i{background:#64748b}
.nm{top:76px;font:700 30px var(--bd);padding:0 70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{top:114px;font:500 20px var(--bd);color:#8fa0bd}
.row{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}
.val{width:190px;text-align:center;font:700 84px/1 var(--bn);font-variant-numeric:tabular-nums}
.val small{display:block;font:600 18px var(--bd);color:#8fa0bd;letter-spacing:0;margin-top:2px}
.rb{width:68px;height:68px;border-radius:50%;border:0;background:#17203a;color:#fff;display:grid;place-items:center;cursor:pointer}
.rb:active{background:#27356a}
.rb svg,.go svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.go{position:absolute;left:113px;width:240px;height:68px;border-radius:34px;border:0;background:var(--ok);color:#03251a;font:700 26px var(--bd);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.go.sec{background:#17203a;color:#e8eef8}
.big{top:120px;font:700 150px/1 var(--bn);font-variant-numeric:tabular-nums}
.btns{position:absolute;left:70px;right:70px;display:flex;gap:12px}
.btns .go{position:static;flex:1;width:auto;height:64px;font-size:23px}
.card{position:absolute;left:46px;right:46px;border-radius:30px;background:#0f1730;padding:12px 26px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;border:0;color:inherit;text-align:left;font:inherit}
.card b{font:700 27px var(--bd)}.card span{font:500 18px var(--bd);color:#8fa0bd}
.card.rec{background:var(--ac);color:#fff}.card.rec span{color:#dbe4ff}
.st{position:absolute;left:96px;right:96px;display:flex;justify-content:space-between;align-items:baseline;font:500 21px var(--bd);color:#8fa0bd}
.st b{font:700 38px var(--bn);color:#f1f5f9}
.cap{max-width:440px;text-align:center;color:var(--mu);font-size:14px;line-height:1.5}
.tg{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--tx);font-family:var(--bd);font-weight:600}
.tg i{width:34px;height:20px;border-radius:12px;background:var(--ok);position:relative;display:block}
.tg i:after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tg.off i{background:#64748b}.tg.off i:after{right:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Vigorexiapp · Reloj</h1>
<div class="tabs" id="tabs"></div>
<div id="box"><div id="watch"></div></div>
<p class="cap" id="cap"></p>
<button class="tg" id="tg"><i></i><span id="tgt">Móvil conectado</span></button>

<script>
var EX=[{n:"Sentadilla trasera",s:4,kg:80,rp:7,pv:"80 × 7",r:180},{n:"Press de banca plano",s:4,kg:70,rp:8,pv:"70 × 8",r:150},{n:"Jalón al pecho",s:4,kg:60,rp:10,pv:"60 × 10",r:120}];
var TOTAL=12,S={scr:"serie",ex:0,set:0,done:0,kg:80,rp:7,rest:0,restMax:180,pend:0,on:true,t:null};
var CAP={dia:"Selector de día: una sola tarjeta destacada con el día recomendado según el historial de ambos dispositivos. “Seguir en el móvil” solo aparece si hay un entreno realmente activo.",serie:"Pantalla de serie: un solo foco. Kilos y reps con botones grandes de 68 px, el anillo del borde muestra el avance de la sesión y el estado de sincronización siempre visible arriba.",descanso:"Descanso: cuenta atrás a pantalla completa, lo que viene después y dos acciones. Vibra a los 10 s y al terminar. El reloj calcula el tiempo solo, sin consultar al móvil.",resumen:"Resumen: tres cifras y el estado de envío al móvil. Si no hay conexión queda en cola y se reintenta solo, sin perder la sesión."};
var ICO={m:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',p:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',c:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function chip(){var c=S.on&&!S.pend?["","Sincronizado"]:S.pend?["p","Pendiente "+S.pend]:["o","Sin móvil"];return '<div class="chip '+c[0]+'"><i></i>'+c[1]+'</div>'}
function arc(f,col,r){var C=2*Math.PI*r;return '<svg class="ring" viewBox="0 0 466 466"><circle cx="233" cy="233" r="'+r+'" fill="none" stroke="#111a30" stroke-width="10"/><circle cx="233" cy="233" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*f)+' '+C+'" transform="rotate(-90 233 233)"/></svg>'}
function view(){
 var e=EX[S.ex],h="";
 if(S.scr==="dia"){
  h=chip()+'<div class="a" style="top:84px;font:700 28px var(--bd)">Elegir día</div>'+
  '<button class="card rec" style="top:128px;height:96px" data-a="start"><span>Recomendado</span><b>Día B · RDL + torso</b></button>'+
  '<button class="card" style="top:236px;height:70px" data-a="start"><b>Día C · Pierna y brazos</b></button>'+
  '<button class="card" style="top:318px;height:70px" data-a="start"><b>Día A · Squat + torso</b></button>';
 }else if(S.scr==="serie"){
  h=arc(S.done/TOTAL,"#6b8cff",226)+chip()+'<div class="a nm">'+e.n+'</div><div class="a sub">Serie '+(S.set+1)+' de '+e.s+' · Ant. '+e.pv+'</div>'+
  '<div class="row" style="top:146px"><button class="rb" data-a="kg-"><span>'+ICO.m+'</span></button><div class="val">'+S.kg.toFixed(1)+'<small>kg</small></div><button class="rb" data-a="kg+">'+ICO.p+'</button></div>'+
  '<div class="row" style="top:246px"><button class="rb" data-a="rp-">'+ICO.m+'</button><div class="val">'+S.rp+'<small>reps</small></div><button class="rb" data-a="rp+">'+ICO.p+'</button></div>'+
  '<button class="go" style="top:352px" data-a="done">'+ICO.c+'Hecha</button>';
 }else if(S.scr==="descanso"){
  var n=EX[S.ex],nx=n.n;
  h=arc(S.rest/S.restMax,"#ffb547",226)+chip()+'<div class="a sub" style="top:84px">Descanso</div><div class="a big" style="color:#ffb547">'+fmt(S.rest)+'</div>'+
  '<div class="a sub" style="top:284px;color:#cbd5e6">Sigue: '+nx+' · serie '+(S.set+1)+'</div>'+
  '<div class="btns" style="top:340px"><button class="go sec" data-a="+15">+15 s</button><button class="go" data-a="skip">Saltar</button></div>';
 }else{
  h=arc(1,"#34d399",226)+chip()+'<div class="a" style="top:84px;font:700 30px var(--bd);color:#34d399">Entreno completado</div>'+
  '<div class="st" style="top:150px"><span>Series</span><b>'+TOTAL+'</b></div><div class="st" style="top:206px"><span>Duración</span><b>52 min</b></div><div class="st" style="top:262px"><span>FC media</span><b>118</b></div>'+
  '<div class="a sub" style="top:322px">'+(S.pend?"En cola, se enviará al volver el móvil":"Enviado al móvil")+'</div>'+
  '<button class="go sec" style="top:362px;height:60px;font-size:23px" data-a="end">Listo</button>';
 }
 document.getElementById("watch").innerHTML=h;
 document.getElementById("cap").textContent=CAP[S.scr==="serie"?"serie":S.scr];
 document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.s===S.scr)});
}
function setScr(s){clearInterval(S.t);S.scr=s;if(s==="descanso")runRest();view()}
function runRest(){S.t=setInterval(function(){S.rest--;if(S.rest<=0){clearInterval(S.t);setScr("serie");return}view()},1000)}
function load(){var e=EX[S.ex];S.kg=e.kg;S.rp=e.rp}
document.getElementById("watch").addEventListener("click",function(ev){
 var b=ev.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,e=EX[S.ex];
 if(a==="start"){S.ex=0;S.set=0;S.done=0;load();setScr("serie")}
 else if(a==="kg-"){S.kg=Math.max(0,S.kg-2.5);view()}else if(a==="kg+"){S.kg+=2.5;view()}
 else if(a==="rp-"){S.rp=Math.max(1,S.rp-1);view()}else if(a==="rp+"){S.rp++;view()}
 else if(a==="done"){S.done++;if(!S.on)S.pend++;
  if(S.done>=TOTAL){setScr("resumen");return}
  if(S.set+1<e.s){S.set++}else{S.ex++;S.set=0;load()}
  S.restMax=e.r;S.rest=e.r;setScr("descanso")}
 else if(a==="+15"){S.rest+=15;S.restMax+=15;view()}
 else if(a==="skip"){setScr("serie")}
 else if(a==="end"){setScr("dia")}
});
document.getElementById("tabs").innerHTML=[["dia","Elegir día"],["serie","Serie"],["descanso","Descanso"],["resumen","Resumen"]].map(function(t){return '<button data-s="'+t[0]+'">'+t[1]+'</button>'}).join("");
document.getElementById("tabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;if(b.dataset.s==="descanso"&&S.rest<=0){S.rest=90;S.restMax=90}setScr(b.dataset.s)});
document.getElementById("tg").onclick=function(){S.on=!S.on;this.classList.toggle("off",!S.on);document.getElementById("tgt").textContent=S.on?"Móvil conectado":"Móvil desconectado";
 if(S.on&&S.pend){view();setTimeout(function(){S.pend=0;view()},900)}else view()};
function fit(){var k=Math.min(1,(window.innerWidth-52)/466),b=document.getElementById("box");b.style.width=466*k+"px";b.style.height=466*k+"px";document.getElementById("watch").style.transform="scale("+k+")"}
window.addEventListener("resize",fit);fit();load();view();
</script>
</body>
</html>
